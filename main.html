<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RoutePlanner — Directions</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
<link rel="stylesheet" href="css/main.css" />
</head>
<body>
<div class="sidebar">
<div class="sidebar-header">
<span class="logo">🗺️</span>
<h2>RoutePlanner</h2>
<div class="header-icons">
<button class="icon-btn" id="accessibilityBtn" title="Accessibility settings" aria-label="Accessibility settings" aria-haspopup="true">♿</button>
<button class="icon-btn" id="settingsBtn" title="Settings" aria-label="Settings" aria-haspopup="true">⚙️</button>
</div>

<div class="dropdown-panel" id="accessibilityPanel">
<h3>Accessibility</h3>

<div class="panel-group">
<label for="fontSelect">Font</label>
<select id="fontSelect">
<option value="font-default">Default</option>
<option value="font-readable">Readable (sans-serif)</option>
<option value="font-serif">Serif</option>
</select>
</div>

<div class="panel-group">
<label>Text Size</label>
<div class="size-btns">
<button class="size-btn" data-size="fs-small">A-</button>
<button class="size-btn" data-size="fs-medium">A</button>
<button class="size-btn" data-size="fs-large">A+</button>
<button class="size-btn" data-size="fs-xlarge">A++</button>
</div>
</div>

<div class="panel-group">
<label>Color Mode</label>
<div class="color-btns">
<button class="color-btn" data-contrast="">Normal</button>
<button class="color-btn" data-contrast="contrast-high">High Contrast</button>
<button class="color-btn" data-contrast="contrast-warm">Warm</button>
</div>
</div>
</div>

<div class="dropdown-panel" id="settingsPanel">
<h3>Settings</h3>

<div class="panel-group">
<label>Appearance</label>
<div class="theme-toggle-row">
<button class="theme-opt" data-theme="light">☀️ Light</button>
<button class="theme-opt" data-theme="dark">🌙 Dark</button>
</div>
</div>

<hr class="panel-divider">

<button class="logout-btn-full" id="signOutBtn">🚪 Sign out</button>
</div>
</div>

<div class="user-chip">
<div class="avatar" id="avatar">?</div>
<div class="user-info">
<strong id="userName">Guest</strong>
<span id="userEmail">Not signed in</span>
</div>
</div>

<div class="search-panel">
<div class="input-group">
<label for="startInput">Starting Point</label>
<div class="input-wrapper">
<input type="text" id="startInput" placeholder="Choose starting point..." />
<button class="gps-btn" id="startGpsBtn" title="Use my location">🎯</button>
</div>
</div>

<div class="input-group">
<label for="endInput">Destination</label>
<div class="input-wrapper">
<input type="text" id="endInput" placeholder="Choose destination..." />
</div>
</div>

<div class="actions">
<button class="btn btn-secondary" id="clearBtn">Clear</button>
<button class="btn btn-primary" id="routeBtn">Navigate</button>
</div>
</div>

<div class="directions-panel" id="directionsContainer">
<div class="directions-placeholder" id="placeholderText">
Enter a start address and a destination location above, then click <b>Navigate</b> to generate directions.
</div>
</div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>
<script src="js/main.js"></script>
</body>
</html>
