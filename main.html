<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Maps Vanilla JS Clone</title>

    <!-- Leaflet Core CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Leaflet Routing Machine CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            display: flex;
        }

        /* Sidebar Control Panel Layout */
        .sidebar {
            width: 380px;
            height: 100%;
            background: #ffffff;
            box-shadow: 4px 0 15px rgba(0, 0, 0, 0.15);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            transition: all 0.3s ease;
        }

        .brand-header {
            padding: 18px 24px;
            border-bottom: 1px solid #e8eaed;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-header h2 {
            font-size: 20px;
            color: #1a73e8;
            font-weight: 600;
        }

        .navigation-box {
            padding: 20px 24px;
            background: #f8f9fa;
            border-bottom: 1px solid #e8eaed;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .input-group {
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .input-group label {
            font-size: 11px;
            text-transform: uppercase;
            font-weight: 700;
            color: #5f6368;
            letter-spacing: 0.8px;
        }

        .input-wrapper {
            display: flex;
            align-items: center;
            background: white;
            border: 1px solid #dadce0;
            border-radius: 8px;
            padding-right: 8px;
            overflow: hidden;
        }

        .input-wrapper:focus-within {
            border-color: #1a73e8;
            box-shadow: 0 0 0 2px rgba(26,115,232,0.2);
        }

        .navigation-box input {
            width: 100%;
            border: none;
            outline: none;
            padding: 12px;
            font-size: 14px;
            color: #3c4043;
        }

        .inline-gps-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
            padding: 4px;
            border-radius: 4px;
        }

        .inline-gps-btn:hover {
            background-color: #f1f3f4;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 4px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 24px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
            text-align: center;
        }

        .btn-primary {
            background: #1a73e8;
            color: white;
        }

        .btn-primary:hover {
            background: #1557b0;
        }

        .btn-secondary {
            background: #e8eaed;
            color: #3c4043;
        }

        .btn-secondary:hover {
            background: #dadce0;
        }

        /* Container designed to hold turn-by-turn text routing instructions */
        .directions-output {
            flex-grow: 1;
            overflow-y: auto;
            padding: 16px 24px;
        }

        .directions-placeholder {
            color: #70757a;
            font-size: 14px;
            text-align: center;
            margin-top: 40px;
            line-height: 1.5;
        }

        /* Map Canvas Layout */
        #map {
            flex-grow: 1;
            height: 100%;
            position: relative;
            z-index: 1;
        }

        /* Target Context Menu Custom Styling for Route Machine Layout overrides */
        .leaflet-routing-container {
            display: none; /* Hide default ugly Leaflet overlay panel - we are piping instructions into our custom sidebar instead! */
        }
    </style>
</head>
<body>

    <!-- Left Google Maps Style Sidebar Panel -->
    <div class="sidebar">
        <div class="brand-header">
            <span style="font-size: 24px;">🗺️</span>
            <h2>RoutePlanner</h2>
        </div>

        <div class="navigation-box">
            <!-- Start Input Location Field -->
            <div class="input-group">
                <label>Starting Point</label>
                <div class="input-wrapper">
                    <input type="text" id="startInput" placeholder="Choose starting point or click GPS..." />
                    <button class="inline-gps-btn" id="startGpsBtn" title="Use current location">🎯</button>
                </div>
            </div>

            <!-- Destination Input Location Field -->
            <div class="input-group">
                <label>Destination</label>
                <div class="input-wrapper">
                    <input type="text" id="endInput" placeholder="Choose destination..." />
                </div>
            </div>

            <div class="action-buttons">
                <button class="btn btn-secondary" id="clearBtn">Clear</button>
                <button class="btn btn-primary" id="routeBtn">Navigate</button>
            </div>
        </div>

        <!-- Populated Turn-by-Turn Dynamic Text Output Container -->
        <div class="directions-output" id="directionsContainer">
            <div class="directions-placeholder" id="placeholderText">
                Enter a start address and a destination location above, then click <b>Navigate</b> to generate directions.
            </div>
        </div>
    </div>

    <!-- Main Map Viewport Window Element -->
    <div id="map"></div>

    <!-- External Leaflet and Routing Dependencies loaded via CDN -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>

    <script>
        // 1. Initialize Map view layout window configurations
        const map = L.map('map', { zoomControl: false }).setView([28.6139, 77.2090], 12); // Defaults over Delhi region
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        // Render OpenStreetMap Base Tiles configuration layer
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // Core App Routing State Management variables
        let startCoords = null;
        let endCoords = null;
        let startMarker = null;
        let endMarker = null;
        let routingControl = null;

        // 2. Geocoding Utility Method (Translates text location string queries into coordinate objects using Nominatim API)
        async function geocodeAddress(addressQuery) {
            if (!addressQuery) return null;
            try {
                const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(addressQuery)}`);
                const results = await response.json();
                if (results && results.length > 0) {
                    return {
                        lat: parseFloat(results[0].lat),
                        lng: parseFloat(results[0].lon),
                        name: results[0].display_name
                    };
                }
                return null;
            } catch (error) {
                console.error("Geocoding communication execution error context:", error);
                return null;
            }
        }

        // 3. Native Geolocation integration handler functionality
        document.getElementById('startGpsBtn').addEventListener('click', () => {
            document.getElementById('startInput').placeholder = "Locating via device GPS...";
            
            map.locate({ setView: true, maxZoom: 15 });
        });

        map.on('locationfound', (e) => {
            startCoords = e.latlng;
            document.getElementById('startInput').value = `My Current Location (${startCoords.lat.toFixed(4)}, ${startCoords.lng.toFixed(4)})`;
            
            if (startMarker) map.removeLayer(startMarker);
            startMarker = L.marker(startCoords).addTo(map).bindPopup("Your Current Location").openPopup();
        });

        map.on('locationerror', () => {
            alert("Could not access browser location telemetry permissions.");
            document.getElementById('startInput').placeholder = "Choose starting point...";
        });

        // 4. Main Core Navigation Thread orchestrator execution sequence 
        document.getElementById('routeBtn').addEventListener('click', async () => {
            const startQuery = document.getElementById('startInput').value.trim();
            const endQuery = document.getElementById('endInput').value.trim();

            if (!endQuery) {
                alert("Please declare a targeted Destination point.");
                return;
            }

            // Show loading status state UI indicators inside panel
            document.getElementById('directionsContainer').innerHTML = '<div class="directions-placeholder">Calculating optimal paths...</div>';

            // Resolve Starting Point text coordinates if not already captured via explicit live GPS device callback triggers
            if (!startCoords && startQuery) {
                const resolvedStart = await geocodeAddress(startQuery);
                if (resolvedStart) {
                    startCoords = L.latLng(resolvedStart.lat, resolvedStart.lng);
                    if (startMarker) map.removeLayer(startMarker);
                    startMarker = L.marker(startCoords).addTo(map).bindPopup("Start: " + resolvedStart.name);
                } else {
                    alert("Could not resolve coordinate matching constraints for Starting Point location field.");
                    resetPlaceholder();
                    return;
                }
            }

            // Resolve Destination point string query arguments 
            const resolvedEnd = await geocodeAddress(endQuery);
            if (resolvedEnd) {
                endCoords = L.latLng(resolvedEnd.lat, resolvedEnd.lng);
                if (endMarker) map.removeLayer(endMarker);
                endMarker = L.marker(endCoords).addTo(map).bindPopup("Destination: " + resolvedEnd.name).openPopup();
            } else {
                alert("Could not resolve destination geometry bounds mapping coordinates targeting.");
                resetPlaceholder();
                return;
            }

            // Trigger Map calculations engine pipelines
            calculateAndDisplayRoute();
        });

        // 5. Compute map path vectors and extract turn-by-turn text metadata into the sidebar
        function calculateAndDisplayRoute() {
            if (routingControl) {
                map.removeControl(routingControl);
            }

            routingControl = L.Routing.control({
                waypoints: [startCoords, endCoords],
                lineOptions: {
                    styles: [{ color: '#1a73e8', opacity: 0.8, weight: 6 }] // Standard Google Maps Material Blue path lines
                },
                createMarker: function() { return null; }, // Suppress duplicate intermediate internal waypoint marker indicators
                addWaypoints: false
            }).addTo(map);

            // Listen for structural calculation completions to extract text instructions
            routingControl.on('routesfound', function(e) {
                const routes = e.routes;
                const summary = routes[0].summary;
                const instructions = routes[0].instructions;
                
                // Format distance parameters (Meters to Kilometers conversion metrics)
                const distanceKm = (summary.totalDistance / 1000).toFixed(1);
                const durationMin = Math.round(summary.totalTime / 60);

                let outputHtml = `
                    <div style="margin-bottom: 20px;">
                        <h3 style="font-size: 18px; color: #202124;">${durationMin} min</h3>
                        <p style="font-size: 14px; color: #70757a;">${distanceKm} km • Via Main Highway routes</p>
                    </div>
                    <hr style="border: 0; border-top: 1px solid #e8eaed; margin-bottom: 16px;">
                    <ol style="padding-left: 20px; display: flex; flex-direction: column; gap: 14px; color: #3c4043; font-size: 14px;">
                `;

                // Loop through text instructions array payload configurations
                instructions.forEach((step) => {
                    outputHtml += `<li style="line-height: 1.4; padding-bottom: 8px; border-bottom: 1px dashed #f1f3f4;">${step.text} <span style="color: #70757a; font-size: 12px;">(${Math.round(step.distance)}m)</span></li>`;
                });

                outputHtml += `</ol>`;
                document.getElementById('directionsContainer').innerHTML = outputHtml;

                // Adjust map boundaries dynamically to perfectly frame our completed pathway geometry context
                const bounds = L.latLngBounds([startCoords, endCoords]);
                map.flyToBounds(bounds, { padding: [50, 50], duration: 1.2 });
            });

            routingControl.on('routingerror', function() {
                document.getElementById('directionsContainer').innerHTML = '<div class="directions-placeholder" style="color: #d93025;">No routing network pathways found spanning specified locations.</div>';
            });
        }

        // 6. Global Canvas state teardown cleanings
        document.getElementById('clearBtn').addEventListener('click', () => {
            if (routingControl) map.removeControl(routingControl);
            if (startMarker) map.removeLayer(startMarker);
            if (endMarker) map.removeLayer(endMarker);
            
            startCoords = null;
            endCoords = null;
            startMarker = null;
            endMarker = null;
            routingControl = null;

            document.getElementById('startInput').value = "";
            document.getElementById('endInput').value = "";
            resetPlaceholder();
            map.flyTo([28.6139, 77.2090], 12);
        });

        function resetPlaceholder() {
            document.getElementById('directionsContainer').innerHTML = `
                <div class="directions-placeholder" id="placeholderText">
                    Enter a start address and a destination location above, then click <b>Navigate</b> to generate directions.
                </div>
            `;
        }
    </script>
</body>
</html>
