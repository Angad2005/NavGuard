<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RoutePlanner — Directions</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Roboto, Arial, Helvetica, sans-serif; height: 100vh; display: flex; overflow: hidden; }

  .sidebar {
    width: 380px; min-width: 380px; height: 100vh; background: #fff;
    display: flex; flex-direction: column; box-shadow: 0 0 12px rgba(0,0,0,.15); z-index: 1000;
  }
  .sidebar-header {
    display: flex; align-items: center; gap: 10px;
    padding: 16px 20px; border-bottom: 1px solid #e8eaed;
  }
  .sidebar-header .logo { font-size: 24px; }
  .sidebar-header h2 { font-size: 20px; font-weight: 500; color: #202124; flex: 1; }

  .user-chip { display: flex; align-items: center; gap: 8px; padding: 10px 20px; background: #f8f9fa; border-bottom: 1px solid #e8eaed; }
  .avatar { width: 30px; height: 30px; border-radius: 50%; background: #1a73e8; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 13px; }
  .user-info { flex: 1; overflow: hidden; }
  .user-info strong { display: block; font-size: 13px; color: #202124; }
  .user-info span { font-size: 11px; color: #70757a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
  .signout-btn { border: 1px solid #dadce0; background: #fff; color: #d93025; font-size: 12px; padding: 6px 12px; border-radius: 999px; cursor: pointer; }
  .signout-btn:hover { background: #fce8e6; }

  .search-panel { padding: 16px 20px; border-bottom: 1px solid #e8eaed; }
  .input-group { margin-bottom: 12px; }
  .input-group label { display: block; font-size: 12px; color: #5f6368; margin-bottom: 6px; }
  .input-wrapper { display: flex; gap: 8px; }
  .input-wrapper input {
    flex: 1; padding: 11px 14px; font-size: 14px; border: 1px solid #dadce0;
    border-radius: 8px; outline: none;
  }
  .input-wrapper input:focus { border-color: #1a73e8; box-shadow: 0 0 0 3px rgba(26,115,232,.15); }
  .gps-btn { border: 1px solid #dadce0; background: #fff; border-radius: 8px; width: 42px; cursor: pointer; font-size: 16px; }
  .gps-btn:hover { background: #f1f3f4; }

  .actions { display: flex; gap: 10px; margin-top: 4px; }
  .btn { flex: 1; padding: 11px; border: 0; border-radius: 8px; font-size: 14px; cursor: pointer; }
  .btn-primary { background: #1a73e8; color: #fff; }
  .btn-primary:hover { background: #1765cc; }
  .btn-secondary { background: #f1f3f4; color: #3c4043; }
  .btn-secondary:hover { background: #e8eaed; }

  .directions-panel { flex: 1; overflow-y: auto; padding: 20px; }
  .directions-placeholder { font-size: 14px; color: #70757a; line-height: 1.6; }

  #map { flex: 1; height: 100vh; }

  @media (max-width: 820px) {
    body { flex-direction: column; }
    .sidebar { width: 100%; min-width: 0; height: 55vh; }
    #map { height: 45vh; }
  }
</style>
</head>
<body>
  <div class="sidebar">
    <div class="sidebar-header">
      <span class="logo">🗺️</span>
      <h2>RoutePlanner</h2>
    </div>

    <div class="user-chip">
      <div class="avatar" id="avatar">?</div>
      <div class="user-info">
        <strong id="userName">Guest</strong>
        <span id="userEmail">Not signed in</span>
      </div>
      <button class="signout-btn" id="signOutBtn">Sign out</button>
    </div>

    <div class="search-panel">
      <div class="input-group">
        <label for="startInput">Starting Point</label>
        <div class="input-wrapper">
          <input type="text" id="startInput" placeholder="Choose starting point..." />
          <button class="gps-btn" id="startGpsBtn" title="Use my location">🎯</button>
        </div>
      </div>

      <div class="input-group">
        <label for="endInput">Destination</label>
        <div class="input-wrapper">
          <input type="text" id="endInput" placeholder="Choose destination..." />
        </div>
      </div>

      <div class="actions">
        <button class="btn btn-secondary" id="clearBtn">Clear</button>
        <button class="btn btn-primary" id="routeBtn">Navigate</button>
      </div>
    </div>

    <div class="directions-panel" id="directionsContainer">
      <div class="directions-placeholder" id="placeholderText">
        Enter a start address and a destination location above, then click <b>Navigate</b> to generate directions.
      </div>
    </div>
  </div>

  <div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>

<script>
  // 0. Session guard + sign out ------------------------------------------
  const session = JSON.parse(localStorage.getItem('rp_session') || 'null');
  if (!session) {
    // Not signed in -> send to login page
    window.location.replace('login.html');
  } else {
    document.getElementById('userName').textContent = session.name;
    document.getElementById('userEmail').textContent = session.email;
    document.getElementById('avatar').textContent = (session.name || '?').charAt(0).toUpperCase();
  }

  document.getElementById('signOutBtn').addEventListener('click', () => {
    if (confirm('Sign out of RoutePlanner?')) {
      localStorage.removeItem('rp_session');
      window.location.href = 'login.html';
    }
  });

  // 1. Initialize map ------------------------------------------------------
  const map = L.map('map', { zoomControl: false }).setView([28.6139, 77.2090], 12);
  L.control.zoom({ position: 'bottomright' }).addTo(map);

  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '© OpenStreetMap contributors'
  }).addTo(map);

  let startCoords = null, endCoords = null;
  let startMarker = null, endMarker = null, routingControl = null;

  // 2. Geocoding utility ---------------------------------------------------
  async function geocodeAddress(addressQuery) {
    if (!addressQuery) return null;
    try {
      const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(addressQuery)}`);
      const results = await response.json();
      if (results && results.length > 0) {
        return { lat: parseFloat(results[0].lat), lng: parseFloat(results[0].lon), name: results[0].display_name };
      }
      return null;
    } catch (error) {
      console.error('Geocoding error:', error);
      return null;
    }
  }

  // 3. Geolocation ---------------------------------------------------------
  document.getElementById('startGpsBtn').addEventListener('click', () => {
    document.getElementById('startInput').placeholder = 'Locating via device GPS...';
    map.locate({ setView: true, maxZoom: 15 });
  });

  map.on('locationfound', (e) => {
    startCoords = e.latlng;
    document.getElementById('startInput').value = `My Current Location (${startCoords.lat.toFixed(4)}, ${startCoords.lng.toFixed(4)})`;
    if (startMarker) map.removeLayer(startMarker);
    startMarker = L.marker(startCoords).addTo(map).bindPopup('Your Current Location').openPopup();
  });

  map.on('locationerror', () => {
    alert('Could not access browser location permissions.');
    document.getElementById('startInput').placeholder = 'Choose starting point...';
  });

  // 4. Navigate ------------------------------------------------------------
  document.getElementById('routeBtn').addEventListener('click', async () => {
    const startQuery = document.getElementById('startInput').value.trim();
    const endQuery = document.getElementById('endInput').value.trim();

    if (!endQuery) { alert('Please enter a destination.'); return; }

    document.getElementById('directionsContainer').innerHTML =
      '<div class="directions-placeholder">Calculating optimal paths...</div>';

    if (!startCoords && startQuery) {
      const resolvedStart = await geocodeAddress(startQuery);
      if (resolvedStart) {
        startCoords = L.latLng(resolvedStart.lat, resolvedStart.lng);
        if (startMarker) map.removeLayer(startMarker);
        startMarker = L.marker(startCoords).addTo(map).bindPopup('Start: ' + resolvedStart.name);
      } else {
        alert('Could not resolve the starting point.');
        resetPlaceholder();
        return;
      }
    }

    if (!startCoords) { alert('Please enter a starting point or use GPS.'); resetPlaceholder(); return; }

    const resolvedEnd = await geocodeAddress(endQuery);
    if (resolvedEnd) {
      endCoords = L.latLng(resolvedEnd.lat, resolvedEnd.lng);
      if (endMarker) map.removeLayer(endMarker);
      endMarker = L.marker(endCoords).addTo(map).bindPopup('Destination: ' + resolvedEnd.name).openPopup();
    } else {
      alert('Could not resolve the destination.');
      resetPlaceholder();
      return;
    }

    calculateAndDisplayRoute();
  });

  // 5. Route + turn-by-turn ------------------------------------------------
  function calculateAndDisplayRoute() {
    if (routingControl) map.removeControl(routingControl);

    routingControl = L.Routing.control({
      waypoints: [startCoords, endCoords],
      lineOptions: { styles: [{ color: '#1a73e8', opacity: 0.8, weight: 6 }] },
      createMarker: function () { return null; },
      addWaypoints: false
    }).addTo(map);

    routingControl.on('routesfound', function (e) {
      const route = e.routes[0];
      const summary = route.summary;
      const distanceKm = (summary.totalDistance / 1000).toFixed(1);
      const durationMin = Math.round(summary.totalTime / 60);

      let outputHtml = `
        <div style="margin-bottom: 20px;">
          <h3 style="font-size: 18px; color: #202124;">${durationMin} min</h3>
          <p style="font-size: 14px; color: #70757a;">${distanceKm} km • Fastest route</p>
        </div>
        <hr style="border: 0; border-top: 1px solid #e8eaed; margin-bottom: 16px;">
        <ol style="padding-left: 20px; display: flex; flex-direction: column; gap: 14px; color: #3c4043; font-size: 14px;">
      `;

      route.instructions.forEach((step) => {
        outputHtml += `<li style="line-height: 1.4; padding-bottom: 8px; border-bottom: 1px dashed #f1f3f4;">${step.text} <span style="color:#70757a; font-size:12px;">(${Math.round(step.distance)}m)</span></li>`;
      });

      outputHtml += '</ol>';
      document.getElementById('directionsContainer').innerHTML = outputHtml;

      map.flyToBounds(L.latLngBounds([startCoords, endCoords]), { padding: [50, 50], duration: 1.2 });
    });

    routingControl.on('routingerror', function () {
      document.getElementById('directionsContainer').innerHTML =
        '<div class="directions-placeholder" style="color:#d93025;">No route found between the specified locations.</div>';
    });
  }

  // 6. Clear ---------------------------------------------------------------
  document.getElementById('clearBtn').addEventListener('click', () => {
    if (routingControl) map.removeControl(routingControl);
    if (startMarker) map.removeLayer(startMarker);
    if (endMarker) map.removeLayer(endMarker);

    startCoords = endCoords = startMarker = endMarker = routingControl = null;

    document.getElementById('startInput').value = '';
    document.getElementById('endInput').value = '';
    resetPlaceholder();
    map.flyTo([28.6139, 77.2090], 12);
  });

  function resetPlaceholder() {
    document.getElementById('directionsContainer').innerHTML = `
      <div class="directions-placeholder" id="placeholderText">
        Enter a start address and a destination location above, then click <b>Navigate</b> to generate directions.
      </div>
    `;
  }
</script>
</body>
</html>
