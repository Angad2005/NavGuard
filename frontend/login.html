<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RoutePlanner — Login / Sign Up</title>
<link rel="stylesheet" href="css/login.css" />
</head>
<body>
<div class="auth-card">
<div class="brand">
<div class="logo">🗺️</div>
<h1>RoutePlanner</h1>
<p>Sign in to save your routes and places</p>
</div>

<div class="tabs">
<button class="tab active" id="loginTab">Login</button>
<button class="tab" id="signupTab">Sign Up</button>
</div>

<div class="msg" id="message"></div>

<form id="loginForm">
<div class="field">
<label for="loginEmail">Email</label>
<input type="email" id="loginEmail" placeholder="you@example.com" required />
</div>

<div class="field">
<label for="loginPassword">Password</label>
<input type="password" id="loginPassword" placeholder="Enter your password" required />
</div>

<div class="row">
<label><input type="checkbox" id="remember" /> Remember me</label>
<a href="#" id="forgot">Forgot password?</a>
</div>

<button class="btn" type="submit">Login</button>
</form>

<form id="signupForm" class="hidden">
<div class="field">
<label for="signupName">Full name</label>
<input type="text" id="signupName" placeholder="Your name" required />
</div>

<div class="field">
<label for="signupEmail">Email</label>
<input type="email" id="signupEmail" placeholder="you@example.com" required />
</div>

<div class="field">
<label for="signupPassword">Password</label>
<input type="password" id="signupPassword" placeholder="At least 6 characters" required />
</div>

<div class="field">
<label for="confirmPassword">Confirm password</label>
<input type="password" id="confirmPassword" placeholder="Re-enter password" required />
</div>

<button class="btn" type="submit">Create account</button>
</form>

<div class="divider">or</div>
<button class="btn-ghost" id="guestBtn">Continue as guest</button>
</div>

<script src="js/login.js"></script>
</body>
</html>
